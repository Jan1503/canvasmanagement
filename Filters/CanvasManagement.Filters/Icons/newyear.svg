<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- New Year celebration icon -->
  <rect fill="#0a0a2e" width="48" height="48"/>
  
  <!-- Fireworks bursts -->
  <g opacity="0.9">
    <!-- Gold firework -->
    <circle cx="16" cy="14" r="1.5" fill="#FFD700"/>
    <line x1="16" y1="14" x2="12" y2="10" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="16" y1="14" x2="20" y2="10" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="16" y1="14" x2="12" y2="18" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="16" y1="14" x2="20" y2="18" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="16" y1="14" x2="16" y2="8" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="16" y1="14" x2="10" y2="14" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="16" y1="14" x2="22" y2="14" stroke="#FFD700" stroke-width="1.5"/>
    
    <!-- Red firework -->
    <circle cx="34" cy="12" r="1.5" fill="#FF1744"/>
    <line x1="34" y1="12" x2="30" y2="8" stroke="#FF1744" stroke-width="1.5"/>
    <line x1="34" y1="12" x2="38" y2="8" stroke="#FF1744" stroke-width="1.5"/>
    <line x1="34" y1="12" x2="30" y2="16" stroke="#FF1744" stroke-width="1.5"/>
    <line x1="34" y1="12" x2="38" y2="16" stroke="#FF1744" stroke-width="1.5"/>
    <line x1="34" y1="12" x2="34" y2="6" stroke="#FF1744" stroke-width="1.5"/>
    <line x1="34" y1="12" x2="40" y2="12" stroke="#FF1744" stroke-width="1.5"/>
  </g>
  
  <!-- "2024" or champagne glasses -->
  <g opacity="0.95">
    <!-- Champagne glasses clinking -->
    <path d="M 18 26 L 18 30 L 16 32 L 20 32 L 18 30" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <path d="M 30 26 L 30 30 L 28 32 L 32 32 L 30 30" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <ellipse cx="18" cy="25" rx="3" ry="2" fill="#FFE4B5" stroke="#FFD700" stroke-width="1"/>
    <ellipse cx="30" cy="25" rx="3" ry="2" fill="#FFE4B5" stroke="#FFD700" stroke-width="1"/>
    
    <!-- Champagne bubbles -->
    <circle cx="20" cy="24" r="0.8" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="22" cy="26" r="0.6" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="26" cy="24" r="0.8" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="28" cy="26" r="0.6" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- Confetti -->
  <rect x="8" y="20" width="2" height="4" fill="#FF1744" opacity="0.8" transform="rotate(15 9 22)"/>
  <rect x="40" y="22" width="2" height="4" fill="#00E676" opacity="0.8" transform="rotate(-20 41 24)"/>
  <rect x="12" y="36" width="2" height="4" fill="#FFD700" opacity="0.8" transform="rotate(30 13 38)"/>
  <rect x="36" y="34" width="2" height="4" fill="#2979FF" opacity="0.8" transform="rotate(-15 37 36)"/>
  <circle cx="10" cy="30" r="1.5" fill="#FF1744" opacity="0.8"/>
  <circle cx="38" cy="28" r="1.5" fill="#00E676" opacity="0.8"/>
  <circle cx="14" cy="42" r="1.5" fill="#FFD700" opacity="0.8"/>
  <circle cx="34" cy="40" r="1.5" fill="#2979FF" opacity="0.8"/>
  
  <!-- Stars/sparkles -->
  <path d="M 24 8 L 25 10 L 27 10 L 25.5 11.5 L 26 13 L 24 12 L 22 13 L 22.5 11.5 L 21 10 L 23 10 Z" 
        fill="#FFFFFF" opacity="0.9"/>
  <path d="M 42 20 L 43 21 L 44 21 L 43.5 21.5 L 44 23 L 42 22 L 41 23 L 41 21.5 L 40 21 L 42 21 Z" 
        fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Celebration glow -->
  <circle cx="24" cy="28" r="16" fill="#FFD700" opacity="0.1"/>
</svg>
