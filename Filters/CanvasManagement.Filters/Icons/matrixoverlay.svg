<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Matrix Overlay icon - layered digital effect -->
  <rect fill="#000000" width="48" height="48"/>
  
  <!-- Base layer (original image representation) -->
  <rect x="8" y="8" width="16" height="16" fill="#4A90E2" opacity="0.6"/>
  <circle cx="32" cy="16" r="6" fill="#E94B3C" opacity="0.6"/>
  
  <!-- Matrix overlay grid -->
  <defs>
    <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 4 0 L 0 0 0 4" fill="none" stroke="#00FF00" stroke-width="0.3" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="48" height="48" fill="url(#grid)"/>
  
  <!-- Digital overlay characters -->
  <text x="10" y="12" font-family="monospace" font-size="5" fill="#00FF00" opacity="0.8">01</text>
  <text x="18" y="16" font-family="monospace" font-size="5" fill="#00FF00" opacity="0.7">10</text>
  <text x="12" y="20" font-family="monospace" font-size="5" fill="#00FF00" opacity="0.9">?</text>
  
  <text x="28" y="14" font-family="monospace" font-size="5" fill="#00FF00" opacity="0.8">Z</text>
  <text x="34" y="18" font-family="monospace" font-size="5" fill="#00FF00" opacity="0.7">1</text>
  <text x="30" y="22" font-family="monospace" font-size="5" fill="#00FF00" opacity="0.9">0</text>
  
  <!-- Falling code trails -->
  <line x1="14" y1="26" x2="14" y2="40" stroke="#00FF00" stroke-width="0.5" opacity="0.6"/>
  <text x="13" y="28" font-family="monospace" font-size="4" fill="#00FF00" opacity="0.9">1</text>
  <text x="13" y="32" font-family="monospace" font-size="4" fill="#00DD00" opacity="0.7">0</text>
  <text x="13" y="36" font-family="monospace" font-size="4" fill="#00AA00" opacity="0.5">1</text>
  <text x="13" y="40" font-family="monospace" font-size="4" fill="#008800" opacity="0.3">0</text>
  
  <line x1="32" y1="26" x2="32" y2="42" stroke="#00FF00" stroke-width="0.5" opacity="0.6"/>
  <text x="31" y="30" font-family="monospace" font-size="4" fill="#00FF00" opacity="0.9">?</text>
  <text x="31" y="34" font-family="monospace" font-size="4" fill="#00DD00" opacity="0.7">Z</text>
  <text x="31" y="38" font-family="monospace" font-size="4" fill="#00AA00" opacity="0.5">1</text>
  <text x="31" y="42" font-family="monospace" font-size="4" fill="#008800" opacity="0.3">0</text>
  
  <!-- Scan line effect -->
  <line x1="0" y1="20" x2="48" y2="20" stroke="#00FF00" stroke-width="0.5" opacity="0.4"/>
  <rect x="0" y="19" width="48" height="2" fill="#00FF00" opacity="0.1"/>
</svg>
