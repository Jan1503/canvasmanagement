<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Valentine's Day / Love filter icon -->
  <defs>
    <radialGradient id="valentineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <rect fill="#FFF0F5" width="48" height="48"/>
  
  <!-- Main heart -->
  <path d="M 24 38 C 18 32, 10 28, 10 20 C 10 14, 14 10, 18 10 C 20 10, 22 11, 24 14 C 26 11, 28 10, 30 10 C 34 10, 38 14, 38 20 C 38 28, 30 32, 24 38 Z" 
        fill="#FF1493" stroke="#FF69B4" stroke-width="2"/>
  
  <!-- Heart highlight/shine -->
  <ellipse cx="18" cy="16" rx="4" ry="5" fill="#FFB6C1" opacity="0.6"/>
  
  <!-- Floating hearts -->
  <path d="M 8 12 C 6 10, 4 9, 4 7 C 4 5, 5 4, 6 4 C 7 4, 8 5, 8 6 C 8 5, 9 4, 10 4 C 11 4, 12 5, 12 7 C 12 9, 10 10, 8 12 Z" 
        fill="#FF69B4" opacity="0.7"/>
  
  <path d="M 42 16 C 40 14, 38 13, 38 11 C 38 9, 39 8, 40 8 C 41 8, 42 9, 42 10 C 42 9, 43 8, 44 8 C 45 8, 46 9, 46 11 C 46 13, 44 14, 42 16 Z" 
        fill="#FF69B4" opacity="0.7"/>
  
  <path d="M 6 36 C 4 34, 2 33, 2 31 C 2 29, 3 28, 4 28 C 5 28, 6 29, 6 30 C 6 29, 7 28, 8 28 C 9 28, 10 29, 10 31 C 10 33, 8 34, 6 36 Z" 
        fill="#FFB6C1" opacity="0.6"/>
  
  <path d="M 42 40 C 40 38, 38 37, 38 35 C 38 33, 39 32, 40 32 C 41 32, 42 33, 42 34 C 42 33, 43 32, 44 32 C 45 32, 46 33, 46 35 C 46 37, 44 38, 42 40 Z" 
        fill="#FFB6C1" opacity="0.6"/>
  
  <!-- Sparkles/stars around heart -->
  <path d="M 14 24 L 15 26 L 17 26 L 15.5 27 L 16 29 L 14 28 L 12 29 L 12.5 27 L 11 26 L 13 26 Z" 
        fill="#FFD700" opacity="0.8"/>
  <path d="M 34 24 L 35 26 L 37 26 L 35.5 27 L 36 29 L 34 28 L 32 29 L 32.5 27 L 31 26 L 33 26 Z" 
        fill="#FFD700" opacity="0.8"/>
  
  <!-- Smaller sparkles -->
  <circle cx="12" cy="20" r="1" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="36" cy="20" r="1" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="20" cy="32" r="1" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="28" cy="32" r="1" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Rose glow background -->
  <circle cx="24" cy="26" r="20" fill="url(#valentineGlow)" opacity="0.4"/>
</svg>
