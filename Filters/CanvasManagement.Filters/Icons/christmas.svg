<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Christmas festive background -->
  <rect fill="#001a33" width="48" height="48"/>
  
  <!-- Falling snowflakes -->
  <circle cx="8" cy="10" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="15" cy="6" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="22" cy="12" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="30" cy="8" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="38" cy="11" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="12" cy="18" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="25" cy="22" r="1.3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="35" cy="20" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="42" cy="25" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Christmas tree (simplified) -->
  <path d="M 24 14 L 18 22 L 20 22 L 16 28 L 19 28 L 15 34 L 33 34 L 29 28 L 32 28 L 28 22 L 30 22 Z" 
        fill="#2d8c42" stroke="#1f6b2f" stroke-width="0.5"/>
  
  <!-- Tree trunk -->
  <rect x="22" y="34" width="4" height="4" fill="#8B4513"/>
  
  <!-- Ornaments (colorful dots) -->
  <circle cx="21" cy="25" r="1.2" fill="#FF0000"/>
  <circle cx="27" cy="26" r="1.2" fill="#FFD700"/>
  <circle cx="24" cy="30" r="1.2" fill="#FF0000"/>
  <circle cx="19" cy="31" r="1.2" fill="#0000FF"/>
  <circle cx="29" cy="31" r="1.2" fill="#FF69B4"/>
  
  <!-- Star on top -->
  <path d="M 24 11 L 25 13.5 L 27.5 13.5 L 25.5 15 L 26 17.5 L 24 16 L 22 17.5 L 22.5 15 L 20.5 13.5 L 23 13.5 Z" 
        fill="#FFD700" stroke="#FFA500" stroke-width="0.3"/>
  
  <!-- Golden glow around tree -->
  <circle cx="24" cy="26" r="15" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
  <circle cx="24" cy="26" r="17" fill="none" stroke="#FFD700" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Shooting star -->
  <line x1="38" y1="14" x2="42" y2="10" stroke="#FFD700" stroke-width="1.5" opacity="0.8"/>
  <line x1="37" y1="13" x2="39" y2="11" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
  <circle cx="38" cy="14" r="1" fill="#FFD700"/>
  
  <!-- More snowflakes -->
  <circle cx="6" cy="32" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="10" cy="38" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="18" cy="40" r="1.3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="32" cy="36" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="40" cy="40" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="44" cy="33" r="1" fill="#FFFFFF" opacity="0.7"/>
</svg>
