<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Halloween spooky filter icon -->
  <rect fill="#1a0a2e" width="48" height="48"/>
  
  <!-- Glowing moon -->
  <circle cx="38" cy="10" r="6" fill="#FFA500" opacity="0.8"/>
  <circle cx="38" cy="10" r="8" fill="#FFA500" opacity="0.3"/>
  
  <!-- Pumpkin (Jack-o'-lantern) -->
  <ellipse cx="24" cy="28" rx="12" ry="10" fill="#FF6B00" stroke="#8B4000" stroke-width="1"/>
  
  <!-- Pumpkin ridges -->
  <path d="M 24 18 Q 24 38, 24 38" stroke="#8B4000" stroke-width="0.8" fill="none"/>
  <path d="M 18 20 Q 18 36, 18 36" stroke="#8B4000" stroke-width="0.8" fill="none"/>
  <path d="M 30 20 Q 30 36, 30 36" stroke="#8B4000" stroke-width="0.8" fill="none"/>
  
  <!-- Stem -->
  <rect x="22" y="16" width="4" height="3" fill="#2d5016" rx="1"/>
  
  <!-- Spooky face -->
  <!-- Left eye (triangle) -->
  <path d="M 18 25 L 21 25 L 19.5 28 Z" fill="#000000"/>
  <!-- Right eye (triangle) -->
  <path d="M 27 25 L 30 25 L 28.5 28 Z" fill="#000000"/>
  <!-- Jagged mouth -->
  <path d="M 17 31 L 19 33 L 21 31 L 23 33 L 25 31 L 27 33 L 29 31 L 31 33" 
        stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Glowing effect from inside pumpkin -->
  <ellipse cx="24" cy="28" rx="10" ry="8" fill="#FFD700" opacity="0.3"/>
  
  <!-- Flying bat silhouette -->
  <path d="M 10 14 L 8 16 L 10 15 L 11 16 L 10 15 L 12 16 L 10 14" fill="#000000"/>
  
  <!-- Spooky fog at bottom -->
  <ellipse cx="24" cy="42" rx="18" ry="4" fill="#9370DB" opacity="0.4"/>
  <ellipse cx="20" cy="44" rx="14" ry="3" fill="#9370DB" opacity="0.3"/>
</svg>
