<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Cel Shading / Anime style icon -->
  <rect fill="#E8F4F8" width="48" height="48"/>
  
  <!-- Anime character face outline (simplified) -->
  <ellipse cx="24" cy="24" rx="14" ry="16" fill="#FFE4C4" stroke="#000000" stroke-width="2"/>
  
  <!-- Hair with flat color cel shading -->
  <path d="M 10 18 Q 10 10, 18 8 Q 24 6, 30 8 Q 38 10, 38 18 L 34 20 Q 30 15, 24 14 Q 18 15, 14 20 Z" 
        fill="#8B4513" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Eyes (large anime style) -->
  <ellipse cx="18" cy="22" rx="3" ry="4" fill="#000000"/>
  <ellipse cx="30" cy="22" rx="3" ry="4" fill="#000000"/>
  <circle cx="17.5" cy="21" r="1.2" fill="#FFFFFF"/>
  <circle cx="29.5" cy="21" r="1.2" fill="#FFFFFF"/>
  
  <!-- Simple mouth -->
  <path d="M 20 30 Q 24 32, 28 30" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Cel shading highlights (flat) -->
  <ellipse cx="16" cy="25" rx="2" ry="3" fill="#FFB6C1" opacity="0.7"/>
  <ellipse cx="32" cy="25" rx="2" ry="3" fill="#FFB6C1" opacity="0.7"/>
  
  <!-- Bold outline accent -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="#000000" stroke-width="3" opacity="0.3"/>
</svg>
