      <stop offset="0%" stop-color="#3DE0FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3DE0FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="6" fill="#0B1020"/>
