<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Kaleidoscope: six mirrored wedges around the centre -->
  <rect width="48" height="48" rx="6" fill="#120A24"/>
  <g transform="translate(24 24)">
    <g id="wedge">
      <path d="M0 0 L20 0 L17.3 10 Z" fill="#FF5DA2"/>
      <path d="M0 0 L12 0 L10.4 6 Z" fill="#FFD25D"/>
      <circle cx="15" cy="3" r="1.6" fill="#5DE3FF"/>
    </g>
    <use href="#wedge" transform="scale(1 -1)"/>
    <use href="#wedge" transform="rotate(120)"/>
    <use href="#wedge" transform="rotate(120) scale(1 -1)"/>
    <use href="#wedge" transform="rotate(240)"/>
    <use href="#wedge" transform="rotate(240) scale(1 -1)"/>
    <circle r="3" fill="#FFFFFF"/>
  </g>
</svg>
