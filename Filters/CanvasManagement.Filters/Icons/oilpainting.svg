<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Oil Painting / Impressionist style icon -->
  <defs>
    <filter id="oilPaint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" />
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  
  <rect fill="#F5E6D3" width="48" height="48"/>
  
  <!-- Canvas texture -->
  <rect fill="#FFF8DC" width="48" height="48" opacity="0.5"/>
  
  <!-- Oil painting strokes (thick brush marks) -->
  <!-- Sky strokes -->
  <ellipse cx="16" cy="12" rx="8" ry="4" fill="#87CEEB" filter="url(#oilPaint)" opacity="0.8"/>
  <ellipse cx="32" cy="10" rx="10" ry="5" fill="#B0E0E6" filter="url(#oilPaint)" opacity="0.8"/>
  
  <!-- Sun/moon with thick paint -->
  <circle cx="38" cy="12" r="5" fill="#FFD700" filter="url(#oilPaint)" opacity="0.9"/>
  <circle cx="38" cy="12" r="4" fill="#FFA500" filter="url(#oilPaint)" opacity="0.7"/>
  
  <!-- Tree/foliage strokes -->
  <ellipse cx="14" cy="28" rx="6" ry="8" fill="#228B22" filter="url(#oilPaint)" opacity="0.8"/>
  <ellipse cx="18" cy="26" rx="5" ry="6" fill="#32CD32" filter="url(#oilPaint)" opacity="0.7"/>
  <ellipse cx="10" cy="30" rx="4" ry="5" fill="#006400" filter="url(#oilPaint)" opacity="0.8"/>
  
  <!-- Field/ground strokes -->
  <ellipse cx="24" cy="36" rx="12" ry="4" fill="#9ACD32" filter="url(#oilPaint)" opacity="0.7"/>
  <ellipse cx="36" cy="38" rx="10" ry="3" fill="#8FBC8F" filter="url(#oilPaint)" opacity="0.7"/>
  
  <!-- Thick paint texture marks -->
  <path d="M 28 24 Q 32 22, 36 24" fill="none" stroke="#CD853F" stroke-width="3" 
        opacity="0.6" filter="url(#oilPaint)" stroke-linecap="round"/>
  <path d="M 6 38 Q 10 36, 14 38" fill="none" stroke="#8B4513" stroke-width="3" 
        opacity="0.6" filter="url(#oilPaint)" stroke-linecap="round"/>
  
  <!-- Impasto (thick paint) highlights -->
  <ellipse cx="20" cy="20" rx="3" ry="2" fill="#FFFFFF" opacity="0.6" filter="url(#oilPaint)"/>
  <ellipse cx="34" cy="32" rx="2" ry="3" fill="#FFFACD" opacity="0.5" filter="url(#oilPaint)"/>
  
  <!-- Canvas edge/frame -->
  <rect x="2" y="2" width="44" height="44" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.5"/>
</svg>
