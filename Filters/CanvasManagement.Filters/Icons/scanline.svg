<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Scanline / CRT TV effect icon -->
  <rect fill="#000000" width="48" height="48"/>
  
  <!-- CRT screen content (colorful image) -->
  <defs>
    <linearGradient id="crtGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#FF00FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFFF00;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Screen content -->
  <rect x="6" y="8" width="36" height="32" fill="url(#crtGlow)" rx="2"/>
  
  <!-- Horizontal scanlines -->
  <line x1="6" y1="10" x2="42" y2="10" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="12" x2="42" y2="12" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="14" x2="42" y2="14" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="16" x2="42" y2="16" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="18" x2="42" y2="18" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="20" x2="42" y2="20" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="22" x2="42" y2="22" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="24" x2="42" y2="24" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="26" x2="42" y2="26" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="28" x2="42" y2="28" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="30" x2="42" y2="30" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="32" x2="42" y2="32" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="34" x2="42" y2="34" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="36" x2="42" y2="36" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="38" x2="42" y2="38" stroke="#000000" stroke-width="1" opacity="0.6"/>
  
  <!-- CRT screen curvature highlight -->
  <ellipse cx="24" cy="24" rx="16" ry="14" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Screen edge glow -->
  <rect x="6" y="8" width="36" height="32" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.4" rx="2"/>
  
  <!-- TV frame -->
  <rect x="4" y="6" width="40" height="36" fill="none" stroke="#333333" stroke-width="3" rx="2"/>
  
  <!-- Retro TV indicators -->
  <circle cx="40" cy="42" r="1.5" fill="#FF0000" opacity="0.8"/>
  <circle cx="44" cy="42" r="1.5" fill="#00FF00" opacity="0.8"/>
</svg>
